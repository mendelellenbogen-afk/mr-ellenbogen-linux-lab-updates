# Lab update 0055: one program (Chrome with many tabs, IntelliJ, ...) may use at
# most 60% of the RAM. Above that the kernel slows that program down and moves
# its memory to the compressed swap, so the rest of the laptop keeps working.
# Same limit for Firefox (Firefox is a snap: snap.firefox.firefox-*.scope).
[Scope]
MemoryHigh=60%
