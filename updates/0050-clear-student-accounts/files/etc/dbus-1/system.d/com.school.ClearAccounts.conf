<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
 "https://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">

<!-- Lab update 0050: "Admin: clear student accounts" on the login screen.
     Anyone may call it; the service itself only answers the login screen
     (polkit) and only with the administrator password. -->
<busconfig>

    <policy user="root">
        <allow own="com.school.ClearAccounts"/>
    </policy>

    <policy context="default">
        <allow send_destination="com.school.ClearAccounts"/>
    </policy>

</busconfig>
